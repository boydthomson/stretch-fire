# STRETCH fire: 60x WS2812B on GPIO18 (via 74AHCT125), controlled from ha-stretch.
# Effects ported from ~/Arduino/fire_flicker/fire_flicker.ino (see fire_effects.h).

esphome:
  name: stretch-fire
  friendly_name: STRETCH Fire
  includes:
    - fire_effects.h
  on_boot:
    priority: -100
    then:
      # Behave like the old sketch: power on = fire on, in Hearth mode.
      - light.turn_on:
          id: fire_light
          brightness: 70%
          effect: Hearth

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 115200

api:
  encryption:
    key: !secret fire_api_key
  actions:
    # HA action esphome.stretch_fire_spark: one burst per sign-up.
    - action: spark
      variables:
        count: int
      then:
        - lambda: |-
            for (int i = 0; i < std::max<int32_t>(1, count); i++) fire::trigger_burst();

ota:
  - platform: esphome
    password: !secret fire_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "STRETCH Fire Fallback"
    password: !secret fire_ap_password

captive_portal:

light:
  - platform: esp32_rmt_led_strip
    id: fire_light
    name: "Fire"
    pin: GPIO18
    num_leds: 60
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_ON
    default_transition_length: 1s
    # Match FastLED's look: no gamma curve, TypicalLEDStrip colour correction.
    gamma_correct: 1.0
    color_correct: [100%, 69%, 94%]
    effects:
      - addressable_lambda:
          name: Hearth
          update_interval: 16ms
          lambda: fire::hearth(it);
      - addressable_lambda:
          name: Fire2012
          update_interval: 16ms
          lambda: fire::fire2012(it, initial_run);

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

button:
  - platform: restart
    name: "Restart"
  - platform: template
    name: "Spark"
    icon: mdi:fire-alert
    on_press:
      - lambda: fire::trigger_burst();
